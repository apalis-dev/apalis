name: Update Changelog

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read

jobs:
  update-changelog:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_TOKEN }}

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update CHANGELOG
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          FORMATTED_TITLE="$(echo "$PR_TITLE" | sed -E 's/^([a-zA-Z0-9_-]+(\([^)]*\))?):/*\1*:/')"
          CHANGELOG_ENTRY="- ${FORMATTED_TITLE} ([#${PR_NUMBER}](https://github.com/${REPO}/pull/${PR_NUMBER}))"
          PR_PATTERN="/pull/${PR_NUMBER})"

          if grep -qF "$PR_PATTERN" CHANGELOG.md; then
            # Entry exists: replace it with the current title
            awk -v entry="$CHANGELOG_ENTRY" -v pattern="$PR_PATTERN" '
              index($0, pattern) { print entry; next }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.tmp
          else
            # No entry yet: insert under [Unreleased]
            awk -v entry="$CHANGELOG_ENTRY" '
              /^## \[Unreleased\]$/ {
                print
                print ""
                print entry
                skip_blank=1
                next
              }
              skip_blank && /^$/ { skip_blank=0; next }
              { skip_blank=0; print }
            ' CHANGELOG.md > CHANGELOG.md.tmp
          fi
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update CHANGELOG for PR #${PR_NUMBER}"
          git push origin "HEAD:${HEAD_REF}"

  automerge:
    needs: update-changelog
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
